<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - StudyHive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Montserrat:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: #1F2A44; /* Dark blue background */
            color: #E6F0FA; /* Light blue-white text */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Static background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(74, 144, 226, 0.15), transparent 70%);
            z-index: -2;
            opacity: 0.4;
        }

        /* Static particle layer */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="2" fill="rgba(74,144,226,0.4)"/></svg>') repeat;
            background-size: 60px 60px;
            z-index: -1;
            opacity: 0.2;
        }

        header {
            background: linear-gradient(180deg, rgba(31, 42, 68, 0.95), rgba(31, 42, 68, 0.7));
            backdrop-filter: blur(20px);
            padding: 20px 50px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(74, 144, 226, 0.3);
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(74, 144, 226, 0.7);
        }

        form {
            background: linear-gradient(135deg, rgba(31, 42, 68, 0.6), rgba(48, 65, 104, 0.4));
            padding: 35px;
            max-width: 400px;
            margin: 150px auto 50px;
            border-radius: 25px;
            border: 2px solid rgba(74, 144, 226, 0.4);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        form:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(74, 144, 226, 0.4);
        }

        .error-message {
            background: rgba(229, 115, 115, 0.2);
            color: #E57373;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            color: #7FB1EB;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            text-align: center;
        }

        input {
            display: block;
            width: calc(100% - 20px);
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: #E6F0FA;
            font-size: 1.1em;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.6);
            transform: scale(1.02);
        }

        input::placeholder {
            color: #A3BFFA;
            font-weight: 300;
        }

        button {
            padding: 14px 35px;
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            border: none;
            color: #1F2A44;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.7);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            header {
                padding: 15px 25px;
            }

            header h1 {
                font-size: 1.8em;
            }

            form {
                margin: 120px auto 25px;
                padding: 25px;
            }

            h2 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>StudyHive</h1>
    </header>
    <form th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="error-message">
            Invalid email or password. Please try again.
        </div>
        <h2>Login to Your Account</h2>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>
</body>
</html>
