<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile - StudyHive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        header {
            background: #6200ea;
            color: white;
            padding: 10px 20px;
        }
        form {
            background: white;
            padding: 20px;
            max-width: 400px;
            margin: 50px auto;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        input {
            display: block;
            width: calc(100% - 20px);
            padding: 8px 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #6200ea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #3700b3;
        }
        .success-message {
            color: green;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Edit Your Profile</h1>
    </header>

    <!-- Success message -->
    <div th:if="${param.success}" class="success-message">
        Profile updated successfully!
    </div>
    <form th:action="@{/profile/updatePassword}" method="post">
        <h2>Change Password</h2>
        
        <!-- Error or Success Messages -->
        <div th:if="${param.success == 'password'}" style="color: green;">
            Password updated successfully!
        </div>
        <div th:if="${param.error == 'password'}" style="color: red;">
            Current password is incorrect. Please try again.
        </div>
        
        <label for="currentPassword">Current Password:</label>
        <input type="password" id="currentPassword" name="currentPassword" required>
        
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" name="newPassword" required>
        
        <button type="submit">Update Password</button>
    </form>

    <form th:action="@{/profile/update}" method="post">
        <input type="text" name="name" th:value="${user.name}" placeholder="Full Name">
        <input type="text" name="courseName" th:value="${profile.courseName}" placeholder="Course Name">
        <input type="text" name="className" th:value="${profile.className}" placeholder="Class Name">
        <input type="text" name="semester" th:value="${profile.semester}" placeholder="Semester">
        <input type="text" name="upcomingExams" th:value="${profile.upcomingExams}" placeholder="Upcoming Exams">
        <button type="submit">Update Profile</button>
    </form>
</body>
</html>
