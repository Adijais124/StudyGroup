<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile - StudyHive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Montserrat:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: #1F2A44;
            color: #E6F0FA;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 80px 50px 50px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(74, 144, 226, 0.15), transparent 70%);
            z-index: -2;
            opacity: 0.4;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="2" fill="rgba(74,144,226,0.4)"/></svg>') repeat;
            background-size: 60px 60px;
            z-index: -1;
            opacity: 0.2;
        }

        header {
            background: linear-gradient(180deg, rgba(31, 42, 68, 0.95), rgba(31, 42, 68, 0.7));
            backdrop-filter: blur(20px);
            padding: 10px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(74, 144, 226, 0.3);
        }

        header h1 {
            display: none;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a, nav form {
            color: #7FB1EB;
            text-decoration: none;
            font-weight: 500;
            margin-left: 15px;
            font-size: 0.9em;
            position: relative;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:first-child::before {
            content: "StudyHive | ";
            color: #4A90E2;
            font-weight: 700;
        }

        nav a:hover, nav form:hover {
            color: #4A90E2;
            transform: scale(1.1);
        }

        nav a::before, nav form::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #7FB1EB, #4A90E2);
            transition: width 0.2s ease;
        }

        nav a:hover::before, nav form:hover::before {
            width: 100%;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            color: #7FB1EB;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            margin-bottom: 15px;
            text-align: center;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            color: #7FB1EB;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            margin: 20px 0 15px;
            font-size: 1.8em;
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #4A90E2, #7FB1EB);
            border-radius: 3px;
        }

        form {
            background: linear-gradient(135deg, rgba(31, 42, 68, 0.6), rgba(48, 65, 104, 0.4));
            padding: 35px;
            border-radius: 25px;
            border: 2px solid rgba(74, 144, 226, 0.4);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.2);
            max-width: 500px;
            margin: 20px auto;
            text-align: left;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        form:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(74, 144, 226, 0.4);
        }

        label {
            color: #A3BFFA;
            font-weight: 300;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: #E6F0FA;
            font-size: 1.1em;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.6);
            transform: scale(1.02);
        }

        input::placeholder {
            color: #A3BFFA;
            font-weight: 300;
        }

        button {
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            border: none;
            color: #1F2A44;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.7);
        }

        .success-message {
            color: #A3BFFA;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
            text-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }

        .error-message {
            color: #FF6B6B;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            body {
                padding: 70px 25px 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            h2 {
                font-size: 1.4em;
            }

            form {
                padding: 25px;
                margin: 15px auto;
            }

            nav a, nav form {
                font-size: 0.8em;
                margin-left: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 style="display:none;">StudyHive</h1>
        <nav>
            <a th:href="@{/dashboard}">Back to Dashboard</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" style="padding: 5px 10px; font-size: 0.9em;">Logout</button>
            </form>
        </nav>
    </header>

    <h1>Edit Your Profile</h1>

    <div th:if="${param.success}" class="success-message">
        Profile updated successfully!
    </div>

    <form th:action="@{/profile/updatePassword}" method="post">
        <h2>Change Password</h2>
        
        <div th:if="${param.success == 'password'}" class="success-message">
            Password updated successfully!
        </div>
        <div th:if="${param.error == 'password'}" class="error-message">
            Current password is incorrect. Please try again.
        </div>
        
        <label for="currentPassword">Current Password:</label>
        <input type="password" id="currentPassword" name="currentPassword" required>
        
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" name="newPassword" required>
        
        <button type="submit">Update Password</button>
    </form>

    <form th:action="@{/profile/update}" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" th:value="${user.name}" placeholder="Full Name">
        
        <label for="courseName">Course Name:</label>
        <input type="text" id="courseName" name="courseName" th:value="${profile.courseName}" placeholder="Course Name">
        
        <label for="className">Class Name:</label>
        <input type="text" id="className" name="className" th:value="${profile.className}" placeholder="Class Name">
        
        <label for="semester">Semester:</label>
        <input type="text" id="semester" name="semester" th:value="${profile.semester}" placeholder="Semester">
        
        <label for="upcomingExams">Upcoming Exams:</label>
        <input type="text" id="upcomingExams" name="upcomingExams" th:value="${profile.upcomingExams}" placeholder="Upcoming Exams">
        
        <button type="submit">Update Profile</button>
    </form>
</body>
</html>
