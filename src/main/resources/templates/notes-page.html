<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Notes for ' + ${group.name}">Notes Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Montserrat:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: #1F2A44;
            color: #E6F0FA;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 80px 50px 50px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(74, 144, 226, 0.15), transparent 70%);
            z-index: -2;
            opacity: 0.4;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="2" fill="rgba(74,144,226,0.4)"/></svg>') repeat;
            background-size: 60px 60px;
            z-index: -1;
            opacity: 0.2;
        }

        header {
            background: linear-gradient(180deg, rgba(31, 42, 68, 0.95), rgba(31, 42, 68, 0.7));
            backdrop-filter: blur(20px);
            padding: 10px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(74, 144, 226, 0.3);
        }

        header h1 {
            display: none; /* Hide the original large StudyHive title */
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a, nav form {
            color: #7FB1EB;
            text-decoration: none;
            font-weight: 500;
            margin-left: 15px; /* Reduced spacing */
            font-size: 0.9em; /* Reduced font size */
            position: relative;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:first-child::before {
            content: "StudyHive | "; /* Add StudyHive before Back to Dashboard */
            color: #4A90E2;
            font-weight: 700;
        }

        nav a:hover, nav form:hover {
            color: #4A90E2;
            transform: scale(1.1);
        }

        nav a::before, nav form::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2px; /* Reduced underline height */
            background: linear-gradient(90deg, #7FB1EB, #4A90E2);
            transition: width 0.2s ease;
        }

        nav a:hover::before, nav form:hover::before {
            width: 100%;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            color: #7FB1EB;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            margin-bottom: 15px;
            text-align: center;
        }

        h2, h3 {
            font-family: 'Montserrat', sans-serif;
            color: #7FB1EB;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            margin: 20px 0 15px;
            position: relative;
        }

        h2 {
            font-size: 1.8em;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #4A90E2, #7FB1EB);
            border-radius: 3px;
        }

        h3 {
            font-size: 1.6em;
        }

        form {
            background: linear-gradient(135deg, rgba(31, 42, 68, 0.6), rgba(48, 65, 104, 0.4));
            padding: 35px;
            border-radius: 25px;
            border: 2px solid rgba(74, 144, 226, 0.4);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.2);
            max-width: 500px;
            margin: 20px auto;
            text-align: left;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        form:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(74, 144, 226, 0.4);
        }

        input,
        textarea,
        button {
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: #E6F0FA;
            font-size: 1.1em;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.6);
            transform: scale(1.02);
        }

        input::placeholder,
        textarea::placeholder {
            color: #A3BFFA;
            font-weight: 300;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            border: none;
            color: #1F2A44;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.7);
        }

        ul {
            list-style-type: none;
            padding: 0;
            max-width: 600px;
            margin: auto;
        }

        li {
            background: rgba(255, 255, 255, 0.08);
            margin: 10px 0;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.2);
            text-align: left;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        li:hover {
            transform: translateX(10px);
            box-shadow: 0 12px 30px rgba(74, 144, 226, 0.4);
        }

        p strong {
            color: #E6F0FA;
            text-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }

        small {
            color: #A3BFFA;
            font-weight: 300;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            color: #7FB1EB;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        a:hover {
            color: #4A90E2;
            transform: scale(1.1);
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 70px 25px 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            h2 {
                font-size: 1.4em;
            }

            h3 {
                font-size: 1.2em;
            }

            form {
                padding: 25px;
                margin: 15px auto;
            }

            nav a, nav form {
                font-size: 0.8em; /* Further reduced for mobile */
                margin-left: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 style="display:none;">StudyHive</h1> <!-- Hidden for styling purposes -->
        <nav>
            <a th:href="@{/dashboard}">Back to Dashboard</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" style="padding: 5px 10px; font-size: 0.9em;">Logout</button> <!-- Reduced button size -->
            </form>
        </nav>
    </header>

    <h1>Notes for Upcoming Exams <span th:text="${group.name}"></span></h1>

    <h3>Upload a Note</h3>
    <form th:action="@{/groups/{groupId}/notes/upload(groupId=${group.id})}" method="post" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Note Title" required />
        <textarea name="content" placeholder="Note Content" required></textarea>
        <input type="file" name="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
        <button type="submit">Upload</button>
    </form>

    <h2>Available Notes</h2>
    <ul>
        <li th:each="note : ${notes}">
            <p th:if="${note != null}"><strong>Title:</strong> <span th:text="${note.title}"></span></p>
            <p th:if="${note != null}"><strong>File Name:</strong> <span th:text="${note.fileName}"></span></p>
            <a th:if="${note.fileData != null}" 
               th:href="@{/groups/{groupId}/notes/{noteId}/file(groupId=${group.id}, noteId=${note.id})}" 
               download>
               📥 Download File
            </a>
            <h3>Comments for this Note</h3>
            <ul>
                <li th:each="comment : ${note.comments}">
                    <p><strong th:text="${comment.user.name}"></strong>: <span th:text="${comment.content}"></span></p>
                    <small th:text="${#temporals.format(comment.timestamp, 'dd MMM yyyy HH:mm')}"></small>
                </li>
            </ul>

            <h3>Add a Comment</h3>
            <form th:action="@{/notes/{noteId}/comments/add(noteId=${note.id})}" method="post">
                <textarea name="content" placeholder="Write your comment..." required></textarea>
                <button type="submit">Post Comment</button>
            </form>
        </li>
    </ul>
</body>
</html>
