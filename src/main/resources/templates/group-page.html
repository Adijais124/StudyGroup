<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Group: ' + ${group.name}">Group Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Montserrat:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: #1F2A44; /* Dark blue background */
            color: #E6F0FA; /* Light blue-white text */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 120px 50px 50px;
        }

        /* Static background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(74, 144, 226, 0.15), transparent 70%);
            z-index: -2;
            opacity: 0.4;
        }

        /* Static particle layer */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="2" fill="rgba(74,144,226,0.4)"/></svg>') repeat;
            background-size: 60px 60px;
            z-index: -1;
            opacity: 0.2;
        }

        header {
            background: linear-gradient(180deg, rgba(31, 42, 68, 0.95), rgba(31, 42, 68, 0.7));
            backdrop-filter: blur(20px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(74, 144, 226, 0.3);
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(74, 144, 226, 0.7);
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: #7FB1EB;
            text-decoration: none;
            font-weight: 500;
            margin-left: 30px;
            position: relative;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            color: #4A90E2;
            transform: scale(1.1);
        }

        nav a::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #7FB1EB, #4A90E2);
            transition: width 0.2s ease;
        }

        nav a:hover::before {
            width: 100%;
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 35px;
            background: linear-gradient(135deg, rgba(31, 42, 68, 0.6), rgba(48, 65, 104, 0.4));
            border-radius: 25px;
            border: 2px solid rgba(74, 144, 226, 0.4);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(74, 144, 226, 0.4);
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5em;
            color: #7FB1EB;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            margin-bottom: 20px;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            color: #7FB1EB;
            font-size: 2em;
            margin: 30px 0 20px;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #4A90E2, #7FB1EB);
            border-radius: 3px;
        }

        h3 {
            font-family: 'Montserrat', sans-serif;
            color: #7FB1EB;
            font-size: 1.8em;
            margin: 30px 0 20px;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
        }

        p {
            color: #BBD7F5;
            font-size: 1.2em;
            line-height: 1.9;
            font-weight: 300;
            margin-bottom: 15px;
        }

        p strong {
            color: #E6F0FA;
            text-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: rgba(255, 255, 255, 0.08);
            margin: 10px 0;
            padding: 20px;
            border-radius: 15px;
            font-weight: 500;
            color: #E6F0FA;
            text-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        li:hover {
            transform: translateX(10px);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.4);
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, #4A90E2, #7FB1EB);
            margin: 30px 0;
        }

        form {
            margin-top: 20px;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: #E6F0FA;
            font-size: 1.1em;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        input[type="text"]:focus,
        textarea:focus,
        input[type="file"]:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.6);
            transform: scale(1.02);
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #A3BFFA;
            font-weight: 300;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            padding: 14px 35px;
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            border: none;
            color: #1F2A44;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.7);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 100px 25px 25px;
            }

            .content {
                width: 100%;
                padding: 25px;
            }

            header {
                flex-direction: column;
                padding: 15px 25px;
            }

            header h1 {
                font-size: 1.8em;
            }

            nav {
                margin-top: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                margin: 8px 15px;
            }

            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.6em;
            }

            h3 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 th:text="${group.name}">Group Name</h1>
        <nav>
            <a href="/profile">Edit Profile</a>
            <a th:href="@{/dashboard}">Back to Dashboard</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </header>

    <div class="content">
        <p th:text="'Course: ' + ${group.course}"></p>
        <p th:text="'Exam: ' + ${group.exam}"></p>
        <p><strong>Admin:</strong> <span th:text="${group.owner.name}"></span></p>

        <h2>Members</h2>
        <ul>
            <li th:each="member : ${group.members}">
                <span th:text="${member.name}"></span>
            </li>
        </ul>

        <hr/>

        <p>Group ID: <span th:text="${group.id}"></span></p>
        <ul>
            <li th:each="note : ${notes}">
                <p>Note ID: <span th:text="${note.id}"></span></p>
                <p>File Name: <span th:text="${note.fileName}"></span></p>
            </li>
        </ul>

        <h3>Upload a Note</h3>
        <form th:action="@{/groups/{groupId}/notes/upload(groupId=${group.id})}" method="post" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Note Title" required />
            <textarea name="content" placeholder="Note Content" required></textarea>
            <input type="file" name="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
            <button type="submit">Upload</button>
        </form>
        <a th:href="@{/groups/{groupId}/notes-page(groupId=${group.id})}">
            <button>View Notes</button>
        </a>
    </div>
</body>
</html>
