<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome to StudyHive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background: #6200ea;
            color: white;
            padding: 10px 20px;
        }
        nav {
            margin: 0;
            display: flex;
            justify-content: flex-end;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }
        .hero {
            padding: 50px;
            text-align: center;
            background: #bb86fc;
            color: white;
        }
        .hero h1 {
            font-size: 2.5em;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .cta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .cta button {
            padding: 10px 20px;
            font-size: 1em;
            background: #6200ea;
            border: none;
            color: white;
            cursor: pointer;
        }
        .cta button:hover {
            background: #3700b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>StudyHive</h1>
        <nav>
            <a href="/login">Log In</a>
            <a href="/signup">Sign Up</a>
        </nav>
    </header>
    <div class="hero">
        <h1>Welcome to StudyHive</h1>
        <p>Your ultimate platform for collaborative learning. Join study groups, connect with peers, and ace your exams.</p>
    </div>
    <div class="content">
        <h2>What is StudyHive?</h2>
        <p>StudyHive helps students find or create virtual study groups for better collaboration and success.</p>
        <div class="cta">
            <button onclick="window.location.href='/signup'">Sign Up Now</button>
            <button onclick="window.location.href='/login'">Log In</button>
        </div>
    </div>
</body>
</html>
