<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome to StudyHive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Montserrat:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: #1F2A44; /* Dark blue background */
            color: #E6F0FA; /* Light blue-white text */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Static background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(74, 144, 226, 0.15), transparent 70%);
            z-index: -2;
            opacity: 0.4;
        }

        /* Static particle layer */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="2" fill="rgba(74,144,226,0.4)"/></svg>') repeat;
            background-size: 60px 60px;
            z-index: -1;
            opacity: 0.2;
        }

        header {
            background: linear-gradient(180deg, rgba(31, 42, 68, 0.95), rgba(31, 42, 68, 0.7));
            backdrop-filter: blur(20px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(74, 144, 226, 0.3);
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(74, 144, 226, 0.7);
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: #7FB1EB;
            text-decoration: none;
            font-weight: 500;
            margin-left: 30px;
            position: relative;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            color: #4A90E2;
            transform: scale(1.1);
        }

        nav a::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #7FB1EB, #4A90E2);
            transition: width 0.2s ease;
        }

        nav a:hover::before {
            width: 100%;
        }

        .hero {
            padding: 120px 50px 50px;
            text-align: center;
            background: linear-gradient(135deg, rgba(31, 42, 68, 0.6), rgba(48, 65, 104, 0.4));
            border-bottom: 2px solid rgba(74, 144, 226, 0.4);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.2);
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5em;
            color: #7FB1EB;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            margin-bottom: 20px;
        }

        .hero p {
            color: #BBD7F5;
            font-size: 1.2em;
            line-height: 1.9;
            font-weight: 300;
        }

        .content {
            padding: 50px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .content h2 {
            font-family: 'Montserrat', sans-serif;
            color: #7FB1EB;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
            position: relative;
        }

        .content h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #4A90E2, #7FB1EB);
            border-radius: 3px;
        }

        .content p {
            color: #BBD7F5;
            font-size: 1.2em;
            line-height: 1.9;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .cta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .cta button {
            padding: 14px 35px;
            background: linear-gradient(45deg, #4A90E2, #7FB1EB);
            border: none;
            color: #1F2A44;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cta button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.7);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 100px 25px 25px;
            }

            header {
                flex-direction: column;
                padding: 15px 25px;
            }

            header h1 {
                font-size: 1.8em;
            }

            nav {
                margin-top: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                margin: 8px 15px;
            }

            .hero {
                padding: 100px 25px 25px;
            }

            .hero h1 {
                font-size: 2em;
            }

            .content {
                padding: 25px;
            }

            .content h2 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>StudyHive</h1>
        <nav>
            <a href="/login">Log In</a>
            <a href="/signup">Sign Up</a>
        </nav>
    </header>
    <div class="hero">
        <h1>Welcome to StudyHive</h1>
        <p>Your ultimate platform for collaborative learning. Join study groups, connect with peers, and ace your exams.</p>
    </div>
    <div class="content">
        <h2>What is StudyHive?</h2>
        <p>StudyHive helps students find or create virtual study groups for better collaboration and success.</p>
        <div class="cta">
            <button onclick="window.location.href='/signup'">Sign Up Now</button>
            <button onclick="window.location.href='/login'">Log In</button>
        </div>
    </div>
</body>
</html>
